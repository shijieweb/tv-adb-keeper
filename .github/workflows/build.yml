name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # 找 sdkmanager（路径随镜像版本变化：cmdline-tools/latest 或 cmdline-tools/<ver>）
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SM" ]; then
            echo "no sdkmanager found, downloading cmdline-tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -sS -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SM"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          # 只装必需组件（注意：仓库里已没有名为 tools 的包，写 tools 会直接失败）
          yes | "$SM" "platform-tools" "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1 || true
          "$SM" --list_installed 2>/dev/null | head -n 40 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show output
        run: find app/build/outputs -name '*.apk' -exec ls -l {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-adb-keeper-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
