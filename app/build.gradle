plugins { id 'com.android.application' }

// 固定签名：CI 默认生成的 debug keystore 每次都不一样，会导致「装不上、只能卸载重装」，
// 而卸载会丢掉 pm grant 给的 WRITE_SECURE_SETTINGS，等于自愈功能失效。
// 所以把 keystore 一起放仓库里（.github/debug.keystore.b64），本地/CI 都解到同一个路径。
def ksPath = rootProject.file('keystore/debug.jks')

android {
    namespace 'com.shijie.adbkeeper'
    compileSdk 33
    defaultConfig {
        applicationId "com.shijie.adbkeeper"
        minSdk 21
        targetSdk 28
        versionCode 3
        versionName "3.0"
    }
    signingConfigs {
        if (ksPath.exists()) {
            fixed {
                storeFile ksPath
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            if (ksPath.exists()) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            if (ksPath.exists()) signingConfig signingConfigs.fixed
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false }
}
