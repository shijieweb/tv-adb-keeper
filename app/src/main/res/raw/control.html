<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>电视触控板</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  header {
    padding: 10px 14px 6px;
    font-size: 15px; color: #9aa6b2;
    display: flex; justify-content: space-between; align-items: center;
  }
  header b { color: #e6edf3; font-size: 17px; }
  #padwrap { padding: 0 10px; }
  #pad {
    position: relative;
    width: 100%; aspect-ratio: 16 / 9;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
    cursor: crosshair;
  }
  /* 画面层：跟电视实时画面 */
  #shot {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #161b22;
    display: none;
    pointer-events: none;
  }
  #pad.live #shot { display: block; }
  #pad.live .hint { display: none; }
  #pad .hint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #30363d; font-size: 15px; pointer-events: none;
    text-align: center; line-height: 1.6;
  }
  #dot {
    position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%; background: rgba(88,166,255,.75);
    border: 2px solid #58a6ff;
    pointer-events: none; opacity: 0;
    transition: opacity .35s;
    z-index: 3;
  }
  #dot.on { opacity: 1; transition: none; }
  #dot.trail {
    transition: left .10s linear, top .10s linear, opacity .35s;
  }
  /* 画面右上角的小状态点 */
  #badge {
    position: absolute; top: 8px; right: 10px; z-index: 4;
    font-size: 11px; color: #7d8590; background: rgba(13,17,23,.72);
    padding: 2px 7px; border-radius: 20px; pointer-events: none;
  }
  .row {
    display: flex; gap: 8px; padding: 10px 10px 0;
    flex-wrap: wrap;
  }
  button {
    flex: 1 1 0; min-width: 72px;
    padding: 14px 8px;
    font-size: 16px; color: #e6edf3;
    background: #21262d; border: 1px solid #30363d;
    border-radius: 10px;
  }
  button:active { background: #30363d; }
  button.on {
    background: #1f6feb; border-color: #58a6ff;
  }
  #msg { padding: 8px 14px 0; font-size: 13px; color: #7d8590; min-height: 20px; }
  #apps { padding: 6px 10px 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #apps button { font-size: 14px; padding: 12px 6px; }
  h2 { font-size: 13px; color: #7d8590; font-weight: normal; margin: 14px 0 0 14px; }
</style>
</head>
<body>
<header><b>电视触控板</b><span id="state">连接中…</span></header>

<div id="padwrap">
  <div id="pad">
    <img id="shot" alt="">
    <div class="hint">在这里点 = 点电视<br>按住拖动 = 滑动</div>
    <div id="badge"></div>
    <div id="dot"></div>
  </div>
</div>

<div class="row">
  <button id="btnSync" onclick="toggleSync()">画面：开</button>
  <button onclick="snap()">拍一张</button>
</div>

<div class="row">
  <button onclick="key('home')">主页</button>
  <button onclick="key('back')">返回</button>
  <button onclick="key('recents')">最近</button>
  <button onclick="key('notifications')">通知</button>
</div>

<h2>打开应用</h2>
<div id="apps"></div>

<div id="msg"></div>

<script>
const pad = document.getElementById('pad');
const dot = document.getElementById('dot');
const msg = document.getElementById('msg');
const stateEl = document.getElementById('state');
const shot = document.getElementById('shot');
const badge = document.getElementById('badge');
const btnSync = document.getElementById('btnSync');
const W = 1920, H = 1080;

/* ---------------- 画面同步 ----------------
   开：每 1.4 秒拉一帧；点完立刻补一帧（能马上看到结果）
   关：完全不拉，省流量/省电，就是纯黑框
   实现上用 <img> 直接换 src，不做 fetch blob，老手机浏览器也不卡。 */
let syncOn = true;
let syncTimer = null;
let lastUrl = '';

function setBadge(t) { badge.textContent = t || ''; }

function pullFrame(force) {
  // 加时间戳防缓存；force=false 时若上一帧还没回来就跳过，避免堆请求
  if (!syncOn && !force) return;
  if (pullFrame.busy && !force) return;
  pullFrame.busy = true;
  const url = '/frame.jpg?t=' + Date.now();
  const img = new Image();
  img.onload = () => {
    shot.src = url;
    pad.classList.add('live');
    lastUrl = url;
    pullFrame.busy = false;
    setBadge('实时 · ' + new Date().toLocaleTimeString().slice(0, 8));
    if (pullFrame.fail) { pullFrame.fail = 0; }
  };
  img.onerror = () => {
    pullFrame.busy = false;
    pullFrame.fail = (pullFrame.fail || 0) + 1;
    if (pullFrame.fail <= 3) setBadge('画面未就绪');
    else { setBadge('画面不可用'); }
  };
  img.src = url;
}

function loop() {
  clearTimeout(syncTimer);
  if (!syncOn) return;
  pullFrame(false);
  syncTimer = setTimeout(loop, 320);
}

function toggleSync() {
  syncOn = !syncOn;
  btnSync.textContent = syncOn ? '画面：开' : '画面：关';
  btnSync.classList.toggle('on', syncOn);
  if (syncOn) {
    setBadge('正在拉画面');
    loop();
  } else {
    clearTimeout(syncTimer);
    syncTimer = null;
    pad.classList.remove('live');
    shot.removeAttribute('src');
    setBadge('');
    showMsg('画面同步已关（省流量）。点「拍一张」可以随时看一眼。');
  }
}

function snap() {
  setBadge('抓一帧…');
  pullFrame(true);
  showMsg('已请求一帧画面。');
}

/* 点完立刻刷一帧，这样能马上看到"我点中了没"——老板最需要的反馈 */
function refreshSoon() {
  if (!syncOn) return;
  setTimeout(() => pullFrame(true), 420);
  setTimeout(() => pullFrame(true), 1100);
}

/* ---------------- 基础 ---------------- */
function showMsg(t) { msg.textContent = t; }

function mark(px, py) {
  dot.classList.remove('trail');
  dot.style.left = px + 'px';
  dot.style.top = py + 'px';
  dot.classList.add('on');
  clearTimeout(mark._t);
  mark._t = setTimeout(() => {
    dot.classList.add('trail');
    dot.classList.remove('on');
  }, 260);
}

function toTv(clientX, clientY) {
  const r = pad.getBoundingClientRect();
  const x = Math.round((clientX - r.left) / r.width * W);
  const y = Math.round((clientY - r.top) / r.height * H);
  return {
    x: Math.max(0, Math.min(W - 1, x)),
    y: Math.max(0, Math.min(H - 1, y)),
    lx: clientX - r.left,
    ly: clientY - r.top
  };
}

function post(path, params) {
  const body = new URLSearchParams(params || {});
  stateEl.textContent = '发送中…';
  return fetch(path, { method: 'POST', body })
    .then(r => r.text())
    .then(t => { stateEl.textContent = t; refreshSoon(); return t; })
    .catch(e => { stateEl.textContent = '连不上'; showMsg('请求失败：' + e); });
}

/* ---- 触摸 / 鼠标统一用 Pointer 事件 ---- */
let down = null;

pad.addEventListener('pointerdown', e => {
  pad.setPointerCapture(e.pointerId);
  const p = toTv(e.clientX, e.clientY);
  down = { p, t: Date.now(), moved: false };
  mark(p.lx, p.ly);
  e.preventDefault();
});

pad.addEventListener('pointermove', e => {
  if (!down) return;
  const p = toTv(e.clientX, e.clientY);
  const d = Math.hypot(p.x - down.p.x, p.y - down.p.y);
  if (d > 12) down.moved = true;
  mark(p.lx, p.ly);
  e.preventDefault();
});

pad.addEventListener('pointerup', e => {
  if (!down) return;
  const p = toTv(e.clientX, e.clientY);
  const dur = Date.now() - down.t;
  const d = Math.hypot(p.x - down.p.x, p.y - down.p.y);

  if (down.moved && d > 24) {
    post('/swipe', { x1: down.p.x, y1: down.p.y, x2: p.x, y2: p.y, ms: Math.min(2000, Math.max(120, dur)) });
  } else if (dur > 550) {
    post('/long', { x: p.x, y: p.y, ms: Math.min(4000, dur) });
  } else {
    post('/tap', { x: p.x, y: p.y });
  }
  down = null;
  e.preventDefault();
});

pad.addEventListener('contextmenu', e => e.preventDefault());

function key(name) {
  post('/key', { k: name });
}

function loadApps() {
  fetch('/apps').then(r => r.json()).then(list => {
    const box = document.getElementById('apps');
    box.innerHTML = '';
    list.forEach(a => {
      const b = document.createElement('button');
      b.textContent = a.label;
      b.onclick = () => post('/open', { pkg: a.pkg });
      box.appendChild(b);
    });
    if (!list.length) box.innerHTML = '<span style="color:#7d8590;font-size:13px">没读到应用列表</span>';
  }).catch(() => {});
}

/* 启动 */
btnSync.classList.add('on');
fetch('/status').then(r => r.text()).then(t => { stateEl.textContent = t; }).catch(() => { stateEl.textContent = '离线'; });
loadApps();
pullFrame(true);          // 首帧：就算同步关着也让老板先看一眼当前画面
loop();
</script>
</body>
</html>
